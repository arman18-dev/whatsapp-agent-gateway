# Render blueprint: one web service (gateway + worker + mock lab in one process) and one Postgres.
# Connect the GitHub repo in Render, choose "New > Blueprint", and it creates both.
# Secrets are generated by Render. Read WHATSAPP_APP_SECRET from the service's Environment tab
# to sign simulated webhooks (see scripts/send-webhook.sh). The Anthropic key is not set: mock mode.
services:
  - type: web
    name: whatsapp-agent-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: gateway,worker,mock-lab
      - key: LLM_MODE
        value: mock
      - key: LLM_SCRIPTED_SPREAD
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
      - key: WORKER_THREADS
        value: "4"
      - key: DB_POOL_SIZE
        value: "10"
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx350m
      - key: WHATSAPP_APP_SECRET
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: gateway-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gateway-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gateway-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gateway-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gateway-db
          property: password

databases:
  - name: gateway-db
    plan: free
    databaseName: gateway
    user: gateway
